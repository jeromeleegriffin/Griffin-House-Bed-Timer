name: Build Bed Timer Android APK
on:
  workflow_dispatch:
  push:
    branches: [android-native-alarms]
    paths:
      - 'android/**'
      - '.github/workflows/build-bed-timer-android.yml'
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || echo "Android 35 platform needs installation"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Verify alarm rotation calculations
        working-directory: android
        run: |
          mkdir -p /tmp/bedtimer-math
          javac -d /tmp/bedtimer-math app/src/main/java/com/griffinhouse/bedtimer/AlarmMath.java
          cat >/tmp/bedtimer-math/AlarmMathTest.java <<'JAVA'
          import com.griffinhouse.bedtimer.AlarmMath;
          public class AlarmMathTest {
            static void check(boolean ok){if(!ok)throw new AssertionError("Alarm math failed");}
            public static void main(String[] args){
              long start=1000000L, interval=198*60000L;
              check(AlarmMath.nextIndex(start-1,start,interval)==0);
              check(AlarmMath.nextIndex(start,start,interval)==0);
              check(AlarmMath.nextIndex(start+1,start,interval)==1);
              check(AlarmMath.nextIndex(start+interval,start,interval)==2);
              check(AlarmMath.bedPosition(22,22)==0);
              check(AlarmMath.dueAt(start,interval,22)-start==72L*3600000L+36L*60000L);
              System.out.println("Alarm rotation tests passed");
            }
          }
          JAVA
          javac -cp /tmp/bedtimer-math -d /tmp/bedtimer-math /tmp/bedtimer-math/AlarmMathTest.java
          java -cp /tmp/bedtimer-math AlarmMathTest
      - name: Restore approved original launcher icon
        run: python3 android/scripts/extract_original_icon.py
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Griffin-Bed-Timer-v0.6-startup-repair-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
